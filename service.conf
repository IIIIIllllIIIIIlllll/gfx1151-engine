# start_hgn.sh / start_gguf.sh（以及 Windows 启动器）共用的配置；同名环境变量优先。
# 两个 Linux 启动器分别只读下面"hgn 权重"或"GGUF 权重"一段，其余部署参数共用。

# 模型目录默认为项目下的 ./models；所有相对路径都以项目根目录为起点。
MODEL_DIR="${MODEL_DIR:-./models}"

# 词表目录（两种权重共用，只需 tokenizer.json，取自原模型 HF 仓库）。
TOKENIZER_DIR="${TOKENIZER_DIR:-$MODEL_DIR/tokenizer}"

# ---- hgn 权重：bash start_hgn.sh ---------------------------------------------
# 主模型（权重主体）。
MODEL_FILE="${MODEL_FILE:-$MODEL_DIR/qwen38-flash-next-w4b.hgn}"
# PLE n-gram 表所在文件。w4b 的 n-gram 表就在主模型文件里，默认与 MODEL_FILE 相同
# （同一文件只映射一次）；halogen v2 权重拆成主体 + 独立 n-gram 文件，例如：
#   MODEL_FILE=$MODEL_DIR/qwen38-flash-next-v2.hgn
#   NGRAM_FILE=$MODEL_DIR/qwen38-flash-next-ngram.hgn
# v1/v2 由引擎按张量类型自动识别，不需要额外开关。
NGRAM_FILE="${NGRAM_FILE:-$MODEL_FILE}"
# overlay（只对 v1/w4b 有效）；不需要可设 OVERLAY_FILE=""。文件不存在时启动器只打一条
# "警告：找不到 overlay"并跳过；主模型是 v2 时即使文件在，引擎也会整体跳过它
# （日志 "overlay ...: would replace hgn v2 tensors ..., skipped"）。
OVERLAY_FILE="${OVERLAY_FILE-$MODEL_DIR/qwen38-flash-next-w4b.overlay.hgn}"
# 独立的 8-bit MTP 投机草稿权重；设 MTP_FILE="" 退回 overlay 内置的 4-bit 草稿头。
MTP_FILE="${MTP_FILE-$MODEL_DIR/qwen38-flash-next-mtp.hgn}"
# 视觉塔；纯文本服务可设 VISION_FILE=""。
VISION_FILE="${VISION_FILE-$MODEL_DIR/qwen38-flash-next-vision.hgn}"

# ---- GGUF 权重：bash start_gguf.sh（与 llama.cpp 同一份文件，见 GGUF.md）------------
# Unsloth 的 Qwen3.8-Flash-Next UD-Q4_K_XL。填第 1 个分片，其余分片须在同一目录。
GGUF_FILE="${GGUF_FILE:-$MODEL_DIR/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf}"
# MTP 投机草稿 sidecar；不用 MTP 投机可设 GGUF_MTP_FILE=""。
GGUF_MTP_FILE="${GGUF_MTP_FILE-$MODEL_DIR/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf}"
# 视觉塔（llama.cpp mmproj）；纯文本服务可设 GGUF_VISION_FILE=""。
GGUF_VISION_FILE="${GGUF_VISION_FILE-$MODEL_DIR/mmproj-BF16.gguf}"

# ---- 部署参数（两种权重共用）--------------------------------------------------

# 引擎内部行协议：默认仅监听本机，不接受外机直连；API 对外提供 HTTP 服务。
# ENGINE_HOST 必须是 IPv4 地址。仅确需外部直连时显式改为 0.0.0.0 或本机网卡 IP。
ENGINE_HOST="${ENGINE_HOST:-127.0.0.1}"
ENGINE_PORT="${ENGINE_PORT:-8730}"

# 监听的IP和端口，默认对外开放。
API_HOST="${API_HOST:-0.0.0.0}"
API_PORT="${API_PORT:-8731}"

# 单条请求的输入+输出上限（不是所有并发的合计），默认 256K = 模型原生上限。
# 它同时是 KV 共享池的默认大小（KV_POOL_TOKENS=0 时）。上限受位置编码约束：
# ROPE_FACTOR=1 时超过 ROPE_ORIGINAL_CTX 只会告警（超出部分未验证）；YaRN 开启
# 时超过 ROPE_FACTOR × ROPE_ORIGINAL_CTX 引擎拒绝启动。想给并发备更多 KV，
# 改 KV_POOL_TOKENS，不要拉伸本项。
MAX_CONTEXT="${MAX_CONTEXT:-262144}"

# prefill 分段（token）：长 prompt 每次 prefill 多少 token，同时决定 prefill 工作区
# 在显存里预留多大（8192≈6.9 GiB，4096≈3.5 GiB），是分段的上限。0 = 引擎默认
# （Windows 8192 / Linux 16384）。Windows 显存紧张时设 4096：128K 实测稳态 PP
# 仅慢 ~2%，首块冷启动反而更快。PARALLEL>1 时还可以用下面的 CONC_PREFILL_CHUNK
# 再往小调，但不会超过这里的值。
PREFILL_CHUNK="${PREFILL_CHUNK:-0}"

# YaRN：默认关闭（ROPE_FACTOR=1 即原生 RoPE）。是否开启只看 ROPE_FACTOR，与
# MAX_CONTEXT 无关——调大 MAX_CONTEXT 或共享池不会自动开 YaRN。单条上下文要超过
# 原生 256K 时才需要开，512K 推荐：MAX_CONTEXT=524288 ROPE_FACTOR=2。
# 开启后 MAX_CONTEXT 不得超过 ROPE_FACTOR × ROPE_ORIGINAL_CTX，否则启动器与
# 引擎都会拒绝启动（并发容量用 KV_POOL_TOKENS 扩，见下）。
# 参数也会写入 KV 快照指纹。
ROPE_FACTOR="${ROPE_FACTOR:-1}"
ROPE_ORIGINAL_CTX="${ROPE_ORIGINAL_CTX:-262144}"
ROPE_BETA_FAST="${ROPE_BETA_FAST:-32}"
ROPE_BETA_SLOW="${ROPE_BETA_SLOW:-1}"
# 0 = YaRN 默认 1 + 0.1*ln(factor)
ROPE_ATTN_SCALE="${ROPE_ATTN_SCALE:-0}"

# MTP gamma：1-8 强制所有请求；0 = 引擎按模式自选（greedy 4 / 采样自适应 γ，09-29 真实文本复测）
MTP_GAMMA="${MTP_GAMMA:-0}"
MEMORY_CAP_GB="${MEMORY_CAP_GB:-86}"
MIN_AVAILABLE_GB="${MIN_AVAILABLE_GB:-100}"
START_TIMEOUT="${START_TIMEOUT:-360}"
STALL_TIMEOUT="${STALL_TIMEOUT:-60}"

# KV 快照（SSD prompt cache）磁盘容量上限 GiB，0 = 关闭，超出按 LRU 逐出；引擎另有
# GDEC_KVSNAP=0 / GDEC_KVSNAP_DIR / GDEC_KVSNAP_MIN 可走环境变量。
KVSNAP_MAX_GB="${KVSNAP_MAX_GB:-20}"

# RAM 检查点（内存 prompt cache）个数上限，0 = 关闭，单个约 118MB，只存 GDN 循环状态。
# API 在每条消息边界发 SNAPS 切点，编辑重发/多轮重渲染抖动命中内存即可，
# 不碰 SSD；GDEC_RCKPT=0 可整体关闭（退回纯 SSD 快照）。
RCKPT_MAX="${RCKPT_MAX:-8}"

# PLE n-gram 表（47.7 GiB，常驻磁盘）的 prefill 批量聚集：1 = io_uring 批量
# pread 直读 pinned staging（环深 256，冷启动 38K prompt 实测省去 ~90s 缺页
# stall）；0 = madvise(WILLNEED)+缺页+memcpy 旧路径。Windows 启动器忽略此
# 开关（IOCP 路径恒开）。GDEC_PLE_URING 环境变量存在时优先于此设置。
PLE_URING="${PLE_URING:-1}"

# 分页 QSA KV（Phase A，256 token 一页）：1 = 开启（默认），0 = 关闭，退回每条序列
# 独占 MAX_CONTEXT 的连续 KV。开启后 RAM 检查点会钉住自己前缀的 KV 页，
# 切到别的对话再切回来时直接恢复、不用重新 prefill；页池不够时从最久没用的
# 检查点开始淘汰。输出与关闭时逐位一致，prefill 开销约 1%。
# 只对生产 kernel 组合（BF16 KV + WMMA，无 WMMA6/UNION）生效，其它组合引擎会告警并忽略。
KV_PAGED="${KV_PAGED:-1}"

# 页池大小（token）：全部并发槽位共享的 KV 总量，与单条上限（MAX_CONTEXT）是
# 两个独立的旋钮。0 = 正好一条 MAX_CONTEXT 序列（默认，不额外占内存）。
# 想让 N 路并发各吃满单条上限就设 N × MAX_CONTEXT（例如 MAX_CONTEXT=262144、
# PARALLEL=2 时设 524288，多占约 9.4 GiB，生产配置每 token 约 37.5 KiB）；
# 想保留更多检查点同理调大。小于 MAX_CONTEXT 时按 MAX_CONTEXT 算。
# Windows：设备内存来自一块上限 95 GiB 的 arena，256K 下基本没有余量，保持 0；
# 池子上限 512K（524288 token），超过启动器拒绝启动。
KV_POOL_TOKENS="${KV_POOL_TOKENS:-0}"

# 并发请求数（1–8，默认 4）：几条序列共享上面那个 KV 页池（默认总共 256K，
# 类似 llama.cpp 默认的共享上下文）。GPU 按请求轮转，单条请求的输出和串行
# 跑逐位一致。池子不够时先丢空闲槽位的 KV，还不够就中断后来的请求（API 返回
# 错误），先来的请求不受影响。每多一路约多占 0.12 GiB 显存（GDN 状态；MTP KV 在共享页池里）。1 = 旧的单路行为。
# 需要 KV_PAGED=1。
PARALLEL="${PARALLEL:-4}"

# 单请求图片数上限（1–256，默认 8）：对整个 messages 历史累计计数。多轮绘图/视觉
# agent 每轮都把生成的图片追加进历史，超过即 400 "at most N images"（不可重试），
# 需要按对话长度调大。每张图约 1–2K token，同时受 64MB 请求体上限约束。
# 引擎不再另设上限（以前固定 16，这里填多大都会被悄悄截到 16），1–256 内填多少就收多少。
# 调大的代价：历史里的每张图每轮都要重新解码、打包发给引擎（已在 KV 里的图跳过视觉塔），
# 1080p 一张约 50 MB 主机内存，API 和引擎各占一份，请求处理完释放；PARALLEL 路同时发图时按路数叠加。
MAX_IMAGES="${MAX_IMAGES:-32}"

# 并发分段（token）：PARALLEL>1 的服务专用，实际分段 = min(本值, PREFILL_CHUNK 的实际值)，
# 只能缩小、不会放大。和 PREFILL_CHUNK 的区别：PREFILL_CHUNK 管显存和单条 prompt 的 PP；
# 这一项管并发时的响应——prefill 只能在层与层之间把 GPU 让给别的会话，分段越小每层越短，
# 别的会话卡得越短。32K prompt prefill 期间别的会话最长卡顿：16384 约 0.8–1.4 s，8192 约
# 0.6 s（09-29 实测 830→624 ms）；代价是这条 prompt 的首 token 约晚 8%。分段不逐位一致，
# 但对 BF16 真值的 KLD 一样（tools/d1a_kld.sh）。注意：PARALLEL>1 时它在启动时一次定死，
# 只有一个请求在跑时也按它分段。0 = 不另设，并发时也用 PREFILL_CHUNK。
# 引擎侧变量 GDEC_CONC_PREFILL_CHUNK。Linux 启动器专用：Windows 启动器不读这一项，
# 那边 PREFILL_CHUNK 默认就是 8192。
CONC_PREFILL_CHUNK="${CONC_PREFILL_CHUNK:-8192}"
