# start_hgn.sh / start_gguf.sh（以及 Windows 启动器）共用的配置；同名环境变量优先。
# 两个 Linux 启动器分别只读下面"hgn 权重"或"GGUF 权重"一段，其余部署参数共用。

# 模型目录默认为项目下的 ./models；所有相对路径都以项目根目录为起点。
MODEL_DIR="${MODEL_DIR:-./models}"

# 词表目录（两种权重共用，只需 tokenizer.json，取自原模型 HF 仓库）。
TOKENIZER_DIR="${TOKENIZER_DIR:-$MODEL_DIR/tokenizer}"

# ---- hgn 权重：bash start_hgn.sh ---------------------------------------------
# 主模型。
MODEL_FILE="${MODEL_FILE:-$MODEL_DIR/qwen38-flash-next-w4b.hgn}"
# overlay；不需要可设 OVERLAY_FILE=""。
OVERLAY_FILE="${OVERLAY_FILE-$MODEL_DIR/qwen38-flash-next-w4b.overlay.hgn}"
# 独立的 8-bit MTP 投机草稿权重；设 MTP_FILE="" 退回 overlay 内置的 4-bit 草稿头。
MTP_FILE="${MTP_FILE-$MODEL_DIR/qwen38-flash-next-mtp.hgn}"
# 视觉塔；纯文本服务可设 VISION_FILE=""。
VISION_FILE="${VISION_FILE-$MODEL_DIR/qwen38-flash-next-vision.hgn}"

# ---- GGUF 权重：bash start_gguf.sh（与 llama.cpp 同一份文件，见 GGUF.md）------------
# Unsloth 的 Qwen3.8-Flash-Next UD-Q4_K_XL。填第 1 个分片，其余分片须在同一目录。
GGUF_FILE="${GGUF_FILE:-$MODEL_DIR/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf}"
# MTP 投机草稿 sidecar；不用 MTP 投机可设 GGUF_MTP_FILE=""。
GGUF_MTP_FILE="${GGUF_MTP_FILE-$MODEL_DIR/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf}"
# 视觉塔（llama.cpp mmproj）；纯文本服务可设 GGUF_VISION_FILE=""。
GGUF_VISION_FILE="${GGUF_VISION_FILE-$MODEL_DIR/mmproj-BF16.gguf}"

# ---- 部署参数（两种权重共用）--------------------------------------------------

ENGINE_PORT="${ENGINE_PORT:-8730}"

# 监听的IP和端口，默认对外开放。
API_HOST="${API_HOST:-0.0.0.0}"
API_PORT="${API_PORT:-8731}"

# 最大上下文长度，默认256K
MAX_CONTEXT="${MAX_CONTEXT:-262144}"

# MTP
MTP_GAMMA="${MTP_GAMMA:-3}"
MEMORY_CAP_GB="${MEMORY_CAP_GB:-86}"
MIN_AVAILABLE_GB="${MIN_AVAILABLE_GB:-100}"
START_TIMEOUT="${START_TIMEOUT:-360}"
STALL_TIMEOUT="${STALL_TIMEOUT:-60}"

# KV 快照（SSD prompt cache）磁盘容量上限 GiB，0 = 关闭，超出按 LRU 逐出；引擎另有
# GDEC_KVSNAP=0 / GDEC_KVSNAP_DIR / GDEC_KVSNAP_MIN 可走环境变量。
KVSNAP_MAX_GB="${KVSNAP_MAX_GB:-20}"

# RAM 检查点（内存 prompt cache）个数上限，0 = 关闭，单个约 118MB，只存 GDN 循环状态。
# API 在每条消息边界发 SNAPS 切点，编辑重发/多轮重渲染抖动命中内存即可，
# 不碰 SSD；GDEC_RCKPT=0 可整体关闭（退回纯 SSD 快照）。
RCKPT_MAX="${RCKPT_MAX:-8}"

# PLE n-gram 表（47.7 GiB，常驻磁盘）的 prefill 批量聚集：1 = io_uring 批量
# pread 直读 pinned staging（环深 256，冷启动 38K prompt 实测省去 ~90s 缺页
# stall）；0 = madvise(WILLNEED)+缺页+memcpy 旧路径。Windows 启动器忽略此
# 开关（IOCP 路径恒开）。GDEC_PLE_URING 环境变量存在时优先于此设置。
PLE_URING="${PLE_URING:-1}"

# 分页 QSA KV（Phase A，256 token 一页）：1 = 开启（默认），0 = 关闭，退回每条序列
# 独占 MAX_CONTEXT 的连续 KV。开启后 RAM 检查点会钉住自己前缀的 KV 页，
# 切到别的对话再切回来时直接恢复、不用重新 prefill；页池不够时从最久没用的
# 检查点开始淘汰。输出与关闭时逐位一致，prefill 开销约 1%。
# 只对生产 kernel 组合（BF16 KV + WMMA，无 WMMA6/UNION）生效，其它组合引擎会告警并忽略。
KV_PAGED="${KV_PAGED:-1}"

# 页池大小（token）：0 = 正好一条 MAX_CONTEXT 序列（默认，不额外占内存）。
# 想让更多对话同时保留检查点就调大，生产配置每 token 约 37.5 KiB，例如
# 524288 = 两条 256K 序列，多占约 9.4 GiB。小于 MAX_CONTEXT 时按 MAX_CONTEXT 算。
# Windows：设备内存来自一块上限 95 GiB 的 arena，256K 下基本没有余量，保持 0。
KV_POOL_TOKENS="${KV_POOL_TOKENS:-0}"

# 并发请求数（1–8，默认 4）：几条序列共享上面那个 KV 页池（默认总共 256K，
# 类似 llama.cpp 默认的共享上下文）。GPU 按请求轮转，单条请求的输出和串行
# 跑逐位一致。池子不够时先丢空闲槽位的 KV，还不够就中断后来的请求（API 返回
# 错误），先来的请求不受影响。每多一路约多占 0.12 GiB 显存（GDN 状态；MTP KV 在共享页池里）。1 = 旧的单路行为。
# 需要 KV_PAGED=1。
PARALLEL="${PARALLEL:-4}"
